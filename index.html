
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>问卷调查研究方法 | Questionnaire Survey</title>

  <style>
    /* 全局设置 */
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: "Microsoft YaHei",
        "PingFang SC", Arial, sans-serif;
      color: #242631;
      background-color: #E8EDF3;
      line-height: 1.6;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 24px;
    }

    .site-header {
      background-color: #0B1929;
      border-bottom: 1px solid #294057;
    }

    .brand-row {
      min-height: 115px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding-top: 18px;
      padding-bottom: 18px;
    }

    .logo-group {
      display: flex;
      align-items: center;
      gap: 24px;
      flex-wrap: wrap;
    }

    .brand-logo {
      display: block;
      max-height: 75px;
      max-width: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
    }

    .brand-note {
      text-align: right;
      border-left: 3px solid #0B1929;
      padding-left: 18px;
      flex-shrink: 0;
    }

    .brand-note strong {
      display: block;
      font-size: 16px;
      color: #FFFFFF;
    }

    .brand-note small {
      display: block;
      margin-top: 4px;
      color: #C1D0DE;
      font-size: 12px;
      letter-spacing: 1px;
    }

    .hero {
      background-color: #0B1929;
      color: #FFFFFF;
      text-align: center;
      padding: 85px 20px 90px;
    }

    .hero .eyebrow {
      font-size: 13px;
      letter-spacing: 3px;
      color: #B4C5D6;
      margin: 0 0 20px;
    }

    .hero h1 {
      font-size: clamp(30px, 5vw, 48px);
      font-weight: 700;
      color: #FFFFFF;
      margin: 10px 0 16px;
    }

    .hero .english {
      font-size: 22px;
      color: #E6EDF5;
      margin: 0 0 18px;
    }

    .hero .description {
      font-size: 15px;
      color: #B9CADB;
      margin: 0;
    }

    .courses {
      background-color: #E8EDF3;
      padding: 70px 0 85px;
    }

    .section-heading {
      border-left: 5px solid #0B1929;
      padding-left: 18px;
      margin-bottom: 35px;
    }

    .section-heading h2 {
      font-size: 30px;
      margin: 0;
      color: #17212D;
    }

    .section-heading p {
      margin: 8px 0 0;
      color: #687386;
      font-size: 16px;
    }

    .course-list {
      display: grid;
      gap: 18px;
    }

    /* 课程卡片 */
    .course-card {
      display: flex;
      align-items: center;
      gap: 22px;
      padding: 26px;
      background-color: #FFFFFF;
      border: 1px solid #DCE3EB;
      border-radius: 14px;
      color: #242631;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .course-card:hover,
    .course-card:focus-visible {
      border-color: #46617D;
      transform: translateY(-3px);
      box-shadow: 0 10px 24px
        rgba(11, 25, 41, 0.12);
    }

    /* 课程编号 */
    .course-number {
      flex: 0 0 62px;
      width: 62px;
      height: 62px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background-color: #E9EFF4;
      color: #0B1929;
      font-size: 22px;
      font-weight: bold;
    }

    .course-info {
      flex: 1;
      min-width: 0;
    }

    .course-info h3 {
      margin: 0 0 4px;
      font-size: 20px;
      color: #17212D;
    }

    .course-info p {
      margin: 0;
      color: #687386;
      font-size: 14px;
    }

    .course-link {
      color: #14283D;
      font-weight: 600;
      font-size: 14px;
      white-space: nowrap;
    }

    footer {
      text-align: center;
      padding: 26px 20px;
      background-color: #FFFFFF;
      border-top: 1px solid #E5E7EB;
      color: #687386;
      font-size: 13px;
    }
    
    @media (max-width: 650px) {

      .brand-row {
        flex-direction: column;
        align-items: flex-start;
        gap: 15px;
      }

      .logo-group {
        gap: 15px;
      }

      .brand-logo {
        max-height: 55px;
      }

      .brand-note {
        border-left: none;
        padding-left: 0;
        text-align: left;
      }

      .hero {
        padding: 65px 20px;
      }

      .hero h1 {
        font-size: 32px;
      }

      .hero .english {
        font-size: 18px;
      }

      .courses {
        padding: 45px 0 60px;
      }

      .section-heading h2 {
        font-size: 26px;
      }

      .course-card {
        padding: 18px;
        gap: 14px;
        flex-wrap: wrap;
      }

      .course-number {
        flex-basis: 48px;
        width: 48px;
        height: 48px;
        font-size: 18px;
      }

      .course-info h3 {
        font-size: 17px;
      }

      .course-link {
        margin-left: 62px;
      }
    }

  </style>
</head>

<body>

  <header class="site-header">

    <div class="container brand-row">

      <div class="logo-group">
        <img
          src="antai-logo.png"
          alt="上海交通大学安泰经济与管理学院 Logo"
          class="brand-logo"
        >

      </div>

      <div class="brand-note">
        <strong>课程教学平台</strong>
        <small>ONLINE COURSE</small>
      </div>

    </div>

  </header>

  <section class="hero"
           style="background-color: #0B1929;">

    <div class="container">

      <p class="eyebrow">
        SURVEY RESEARCH METHODS
      </p>

      <h1>问卷调查研究方法</h1>

      <p class="english">
        Questionnaire Survey
      </p>

      <p class="description">
        课程讲义 · 在线学习 · 研究实践
      </p>

    </div>

  </section>

  <main class="courses" id="courses">

    <div class="container">

      <div class="section-heading">

        <h2>课程目录</h2>

        <p>
          选择课程章节，在线阅读教学课件
        </p>

      </div>


      <div class="course-list">

        <!-- Session 1 -->
        <a
          class="course-card"
          href="session1.pdf"
          target="_blank"
          rel="noopener noreferrer"
        >

          <span class="course-number">
            01
          </span>

          <span class="course-info">
            <h3>Session 1</h3>
            <p>第一节课 · PDF 课件</p>
          </span>

          <span class="course-link">
            阅读课件 ↗
          </span>

        </a>


        <!-- Session 2 -->
        <a
          class="course-card"
          href="session2.pdf"
          target="_blank"
          rel="noopener noreferrer"
        >

          <span class="course-number">
            02
          </span>

          <span class="course-info">
            <h3>Session 2</h3>
            <p>第二节课 · PDF 课件</p>
          </span>

          <span class="course-link">
            阅读课件 ↗
          </span>

        </a>


        <!-- Session 3 -->
        <a
          class="course-card"
          href="session3.pdf"
          target="_blank"
          rel="noopener noreferrer"
        >

          <span class="course-number">
            03
          </span>

          <span class="course-info">
            <h3>Session 3</h3>
            <p>第三节课 · PDF 课件</p>
          </span>

          <span class="course-link">
            阅读课件 ↗
          </span>

        </a>

      </div>

    </div>

  </main>


  <footer>
    Questionnaire Survey · 课程学习页面
  </footer>

</body>
</html>
