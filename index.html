
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>问卷调查研究方法 | Questionnaire Survey</title>

  <style>
    :root {
      --sjtu-red: #17365D;
      --dark-red: #102840;
      --bg: #F6F8FB;
      --text: #242631;
      --muted: #687386;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Microsoft YaHei",
        "PingFang SC", Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
      line-height: 1.6;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      padding: 0 24px;
    }

    /* 顶部学院 Logo */
    .site-header {
      background: white;
      border-bottom: 1px solid #eee;
    }

    .brand-row {
      min-height: 112px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding-top: 16px;
      padding-bottom: 16px;
    }

    .brand-logo {
      display: block;
      max-width: min(100%, 460px);
      max-height: 82px;
      width: auto;
      height: auto;
      object-fit: contain;
    }

    .brand-note {
      text-align: right;
      border-left: 2px solid var(--sjtu-red);
      padding-left: 18px;
      flex-shrink: 0;
    }

    .brand-note strong {
      display: block;
      font-size: 16px;
    }

    .brand-note small {
      color: var(--muted);
      font-size: 12px;
    }

    /* 上海交通大学红色主题 */
    .hero {
      background: var(--sjtu-red);
      color: white;
      text-align: center;
      padding: 78px 20px 82px;
    }

    .hero .eyebrow {
      font-size: 13px;
      letter-spacing: 2px;
      opacity: 0.85;
    }

    .hero h1 {
      font-size: clamp(30px, 5vw, 48px);
      margin: 12px 0;
    }

    .hero .english {
      font-size: 21px;
      margin: 12px 0;
    }

    .hero .description {
      font-size: 15px;
      opacity: 0.9;
    }

    /* 课程目录 */
    .courses {
      padding: 62px 0 80px;
    }

    .section-heading {
      border-left: 5px solid var(--sjtu-red);
      padding-left: 16px;
      margin-bottom: 28px;
    }

    .section-heading h2 {
      font-size: 28px;
      margin: 0;
    }

    .section-heading p {
      margin: 6px 0 0;
      color: var(--muted);
    }

    .course-list {
      display: grid;
      gap: 16px;
    }

    .course-card {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 24px;
      background: white;
      border: 1px solid #e5e8ed;
      border-radius: 14px;
      color: var(--text);
      text-decoration: none;
      transition: 0.2s;
    }

    .course-card:hover,
    .course-card:focus-visible {
      border-color: var(--sjtu-red);
      transform: translateY(-2px);
      box-shadow: 0 8px 22px
        rgba(16, 40, 64, 0.10);
    }

    .course-number {
      flex: 0 0 58px;
      width: 58px;
      height: 58px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: #E8F0F7;
      color: var(--sjtu-red);
      font-size: 20px;
      font-weight: bold;
    }

    .course-info {
      flex: 1;
      min-width: 0;
    }

    .course-info h3 {
      margin: 0 0 3px;
      font-size: 19px;
    }

    .course-info p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }

    .course-link {
      color: var(--dark-red);
      font-weight: bold;
      font-size: 14px;
      white-space: nowrap;
    }

    footer {
      text-align: center;
      padding: 22px;
      background: white;
      color: var(--muted);
      font-size: 13px;
    }

    /* 手机适配 */
    @media (max-width: 650px) {
      .brand-row {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
      }

      .brand-logo {
        max-width: 100%;
      }

      .brand-note {
        border-left: none;
        padding-left: 0;
        text-align: left;
      }

      .hero {
        padding: 58px 20px;
      }

      .course-card {
        padding: 17px;
        gap: 14px;
      }

      .course-number {
        flex-basis: 46px;
        width: 46px;
        height: 46px;
      }

      .course-link {
        font-size: 12px;
      }
    }
  </style>
</head>

<body>

  <!-- 顶部 Logo -->
  <header class="site-header">
    <div class="container brand-row">

      <img
        src="antai-logo.png"
        alt="上海交通大学安泰经济与管理学院 Logo"
        class="brand-logo"
      >

      <div class="brand-note">
        <strong>课程教学平台</strong>
        <small>ONLINE COURSE</small>
      </div>

    </div>
  </header>

  <!-- 红色课程标题区域 -->
  <section class="hero">

    <p class="eyebrow">
      SURVEY RESEARCH METHODS
    </p>

    <h1>问卷调查研究方法</h1>

    <p class="english">
      Questionnaire Survey
    </p>

    <p class="description">
      课程讲义 · 在线学习 · 研究实践
    </p>

  </section>

  <!-- 课程目录 -->
  <main class="courses" id="courses">
    <div class="container">

      <div class="section-heading">
        <h2>课程目录</h2>
        <p>选择课程章节，在线阅读教学课件</p>
      </div>

      <div class="course-list">

        <!-- 第一节课 -->
        <a class="course-card"
           href="session1.pdf"
           target="_blank"
           rel="noopener noreferrer">

          <span class="course-number">01</span>

          <span class="course-info">
            <h3>Session 1</h3>
            <p>第一节课 · PDF 课件</p>
          </span>

          <span class="course-link">
            阅读课件 ↗
          </span>

        </a>

        <!-- 第二节课 -->
        <a class="course-card"
           href="session2.pdf"
           target="_blank"
           rel="noopener noreferrer">

          <span class="course-number">02</span>

          <span class="course-info">
            <h3>Session 2</h3>
            <p>第二节课 · PDF 课件</p>
          </span>

          <span class="course-link">
            阅读课件 ↗
          </span>

        </a>

        <!-- 第三节课 -->
        <a class="course-card"
           href="session3.pdf"
           target="_blank"
           rel="noopener noreferrer">

          <span class="course-number">03</span>

          <span class="course-info">
            <h3>Session 3</h3>
            <p>第三节课 · PDF 课件</p>
          </span>

          <span class="course-link">
            阅读课件 ↗
          </span>

        </a>

      </div>
    </div>
  </main>

  <!-- 底部 -->
  <footer>
    Questionnaire Survey · 课程学习页面
  </footer>

</body>
</html>
